<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161311">
<title>Reel · Desktop</title>
<link rel="icon" href="/assets/sona-ui/flame.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/sona-ui/tokens.css">
<link rel="stylesheet" href="/assets/sona-ui/components.css">
<script src="/assets/sona-ui/theme.js"></script>
<style>
  body { min-height: 100dvh; display: grid; place-items: center; padding: var(--sp-5); background: var(--bg-tint), var(--bg); }
  .card { width: min(100%, 400px); text-align: center; padding: var(--sp-8) var(--sp-6) var(--sp-6); }
  .badge { display: grid; place-items: center; width: 64px; height: 64px; margin: 0 auto var(--sp-4); border-radius: 22px; background: var(--accent-soft); color: var(--accent-text); }
  .badge .s-i { width: 30px; height: 30px; }
  h1 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: var(--fs-3xl); line-height: 1.1; }
  .sub { margin: var(--sp-2) 0 var(--sp-6); color: var(--text-3); font-size: var(--fs-sm); }
  .pin { text-align: center; letter-spacing: .3em; font-family: var(--font-mono); min-height: 52px; }
  .pin:placeholder-shown { letter-spacing: normal; font-family: var(--font-ui); }
  .pin.err { border-color: var(--danger); box-shadow: 0 0 0 3px var(--danger-soft); animation: s-shake .35s; }
  form .s-btn, #pkBtn { width: 100%; margin-top: var(--sp-3); }
  .msg { min-height: 1.4em; margin: var(--sp-4) 0 0; font-size: var(--fs-sm); color: var(--danger); }
  .back { margin-top: var(--sp-4); }
</style>
</head>
<body>
  <main class="card s-card">
    <div class="badge" aria-hidden="true"><svg class="s-i"><use href="/assets/sona-ui/icons.svg#monitor"/></svg></div>
    <h1>Remote desktop</h1>
    <p class="sub">Full control of your computer. Confirm it is you to continue.</p>
    <button id="pkBtn" class="s-btn" type="button" style="display:none"><svg class="s-i" aria-hidden="true"><use href="/assets/sona-ui/icons.svg#key"/></svg>Unlock with a passkey</button>
    <form id="f" autocomplete="off">
      <input id="pin" class="pin s-input" type="password" inputmode="text" autocomplete="off"
             placeholder="Admin passcode" maxlength="64" aria-label="Admin passcode" />
      <button id="go" class="s-btn s-btn--primary" type="submit">Unlock the desktop</button>
    </form>
    <div class="msg" id="msg" role="alert"></div>
    <a class="s-btn s-btn--ghost back" href="/"><svg class="s-i" aria-hidden="true"><use href="/assets/sona-ui/icons.svg#back"/></svg>Back to your library</a>
  </main>

<script>
const pin = document.getElementById('pin');
const msg = document.getElementById('msg');
const go  = document.getElementById('go');
const pkBtn = document.getElementById('pkBtn');
const VNC = '/desktop-client.html';
function enter() { location.replace(VNC); }
function shake(t) { pin.classList.add('err'); setTimeout(() => pin.classList.remove('err'), 400); msg.textContent = t; }

// base64url <-> ArrayBuffer (no library, keeps the client buildless)
const b2b = s => { s = s.replace(/-/g,'+').replace(/_/g,'/'); s += '='.repeat((4 - s.length % 4) % 4); const bin = atob(s), u = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u.buffer; };
const b2u = b => { const u = new Uint8Array(b); let s=''; for (const x of u) s += String.fromCharCode(x); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); };

async function passkeyLogin() {
  if (!window.PublicKeyCredential) { msg.textContent = 'This browser has no passkey support'; return; }
  pkBtn.disabled = true; msg.textContent = 'Waiting for your passkey';
  try {
    const r1 = await fetch('/api/webauthn/auth-begin', { method: 'POST' });
    if (!r1.ok) { const d = await r1.json().catch(() => ({})); throw new Error(d.wait ? `Locked. Wait ${d.wait} seconds.` : 'No passkey'); }
    const opts = await r1.json();
    opts.challenge = b2b(opts.challenge);
    (opts.allowCredentials || []).forEach(c => c.id = b2b(c.id));
    const cred = await navigator.credentials.get({ publicKey: opts });
    const asr = {
      id: cred.id, rawId: b2u(cred.rawId), type: cred.type,
      clientExtensionResults: cred.getClientExtensionResults ? cred.getClientExtensionResults() : {},
      response: {
        clientDataJSON: b2u(cred.response.clientDataJSON),
        authenticatorData: b2u(cred.response.authenticatorData),
        signature: b2u(cred.response.signature),
        userHandle: cred.response.userHandle ? b2u(cred.response.userHandle) : undefined,
      },
    };
    const r2 = await fetch('/api/webauthn/auth-finish', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ asr }) });
    if (r2.ok) return enter();
    msg.textContent = 'Passkey rejected';
  } catch (e) {
    msg.textContent = (e && e.name === 'NotAllowedError') ? 'Passkey cancelled' : ('Passkey failed. ' + (e.message || ''));
  } finally { pkBtn.disabled = false; }
}
pkBtn.addEventListener('click', passkeyLogin);

// already admin: straight in; else show the unlock card, plus the passkey button if any are enrolled
fetch('/api/desktop-status').then(r => r.json()).then(async d => {
  if (d && d.authed) return enter();
  try {
    const s = await (await fetch('/api/webauthn/status')).json();
    if (s.enrolled > 0 && window.PublicKeyCredential) pkBtn.style.display = 'block';
  } catch {}
  pin.focus();
}).catch(() => {});

document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const v = pin.value.trim();
  if (!v) return;
  go.disabled = true; msg.textContent = '';
  try {
    const r = await fetch('/api/admin-auth', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin: v })
    });
    if (r.ok) { enter(); return; }
    const d = await r.json().catch(() => ({}));
    pin.value = ''; pin.focus();
    shake(d.wait ? `Too many tries. Wait ${d.wait} seconds.` : 'That is not the admin passcode');
  } catch {
    msg.textContent = 'Could not reach home. Check your connection.';
  } finally {
    go.disabled = false;
  }
});
</script>
</body>
</html>
