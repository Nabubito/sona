<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#161311"/>
<title>Reel · Sona</title>
<!-- Everything this page needs lives under /assets, which is served before the auth wall. -->
<link rel="icon" href="/assets/sona-ui/flame.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="/assets/sona-ui/tokens.css"/>
<link rel="stylesheet" href="/assets/sona-ui/components.css"/>
<script src="/assets/sona-ui/theme.js"></script>
</head>
<body>
<main class="s-gate" data-sona-gate data-len="4" data-endpoint="/api/auth" data-field="pin" data-next="/" aria-labelledby="gateName">
  <div class="s-gate__glow" aria-hidden="true"></div><div class="s-gate__grain" aria-hidden="true"></div>
  <div class="s-gate__corner">
    <button type="button" class="s-iconbtn" data-scheme-cycle aria-label="Theme"><svg class="s-i" aria-hidden="true"><use href="/assets/sona-ui/icons.svg#auto"/></svg></button>
  </div>
  <div class="s-gate__panel">
    <div class="s-gate__mark" aria-hidden="true"><svg viewBox="0 0 48 48"><defs><linearGradient id="sonaFlameGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3CE86"/><stop offset=".5" stop-color="#E7A94C"/><stop offset="1" stop-color="#E1712B"/></linearGradient></defs><path fill="url(#sonaFlameGrad)" d="M24 3c1 7-3 11-7 15-2 2-4 5-4 9a11 11 0 0 0 22 0c0-5-3-8-6-12-1 3-3 4-5 5 2-6-1-12 0-17Z"/><path fill="#161311" opacity=".22" d="M24 20c1 3-1 6-3 8-1 1-2 3-2 5a5 5 0 0 0 10 0c0-3-2-5-4-7 0 2-1 3-2 4 1-3 0-7 1-10Z"/></svg></div>
    <h1 class="s-gate__name" id="gateName">Reel</h1>
    <p class="s-gate__tag">Your music and film</p>
    <div class="s-gate__dots" role="status" aria-live="polite"></div>
    <p class="s-gate__msg" role="alert"></p>
    <div class="s-gate__pad" role="group" aria-label="Passcode keypad">
      <button type="button" class="s-key" data-k="1">1</button><button type="button" class="s-key" data-k="2">2</button><button type="button" class="s-key" data-k="3">3</button>
      <button type="button" class="s-key" data-k="4">4</button><button type="button" class="s-key" data-k="5">5</button><button type="button" class="s-key" data-k="6">6</button>
      <button type="button" class="s-key" data-k="7">7</button><button type="button" class="s-key" data-k="8">8</button><button type="button" class="s-key" data-k="9">9</button>
      <button type="button" class="s-key s-key--fn" data-k="clr">Clear</button><button type="button" class="s-key" data-k="0">0</button>
      <button type="button" class="s-key s-key--fn" data-k="del" aria-label="Delete"><svg class="s-i" aria-hidden="true"><use href="/assets/sona-ui/icons.svg#backspace"/></svg></button>
    </div>
  </div>
  <p class="s-gate__foot"><b>Sona</b><span aria-hidden="true">·</span><span>under your roof</span></p>
</main>
<script src="/assets/sona-ui/gate.js"></script>
</body>
</html>
