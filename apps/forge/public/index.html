<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161311">
<title>Forge · Sona</title>
<link rel="icon" href="/assets/sona-ui/flame.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/sona-ui/tokens.css">
<link rel="stylesheet" href="/assets/sona-ui/components.css">
<link rel="stylesheet" href="/public/styles.css">
<link rel="stylesheet" href="/public/editor.css">
<script src="/assets/sona-ui/theme.js"></script>
</head>
<body data-tab="home">
<a class="s-skip" href="#view">Skip to content</a>
<div id="app" class="s-shell s-shell--sidebar">
  <!-- desktop sidebar -->
  <aside class="s-sidebar side" aria-label="Forge">
    <div class="s-sidebar__brand"><img src="/assets/sona-ui/flame.svg" alt="" width="26" height="26"><span class="s-wordmark">Forge</span></div>
    <nav class="side-nav" aria-label="Sections">
      <button class="s-navlink nav" data-view="home"><svg class="s-i" aria-hidden="true"><use href="/assets/sona-ui/icons.svg#home"/></svg>Home</button>
      <button class="s-navlink nav" data-view="media"><svg class="s-i" aria-hidden="true"><use href="/assets/sona-ui/icons.svg#film"/></svg>Media</button>
      <button class="s-navlink nav" data-view="edit"><svg class="s-i" aria-hidden="true"><use href="/assets/sona-ui/icons.svg#scissors"/></svg>Video editor</button>
      <button class="s-navlink nav" data-view="archives"><svg class="s-i" aria-hidden="true"><use href="/assets/sona-ui/icons.svg#archive"/></svg>Archives</button>
      <button class="s-navlink nav" data-view="discs"><svg class="s-i" aria-hidden="true"><use href="/assets/sona-ui/icons.svg#disc"/></svg>Discs</button>
    </nav>
    <div class="s-sidebar__spacer"></div>
    <div class="side-note"><svg class="s-i s-i--sm" aria-hidden="true"><use href="/assets/sona-ui/icons.svg#lock"/></svg><span>Files never leave this machine.</span></div>
    <button class="s-navlink nav" data-view="jobs" aria-controls="jobsTray"><svg class="s-i" aria-hidden="true"><use href="/assets/sona-ui/icons.svg#layers"/></svg>Jobs<b id="jobBadge" class="jobbadge" aria-label="running jobs"></b></button>
    <button class="s-navlink" id="lockBtn"><svg class="s-i" aria-hidden="true"><use href="/assets/sona-ui/icons.svg#lock"/></svg>Lock Forge</button>
    <div class="side-scheme s-seg" role="group" aria-label="Light or dark">
      <button class="s-seg__btn" data-scheme-set="auto" aria-label="Automatic theme" title="Automatic"><svg class="s-i" aria-hidden="true"><use href="/assets/sona-ui/icons.svg#auto"/></svg></button>
      <button class="s-seg__btn" data-scheme-set="light" aria-label="Light theme" title="Light"><svg class="s-i" aria-hidden="true"><use href="/assets/sona-ui/icons.svg#sun"/></svg></button>
      <button class="s-seg__btn" data-scheme-set="dark" aria-label="Dark theme" title="Dark"><svg class="s-i" aria-hidden="true"><use href="/assets/sona-ui/icons.svg#moon"/></svg></button>
    </div>
  </aside>

  <main class="stage">
    <header class="topbar s-appbar">
      <span class="topbrand" aria-hidden="true"><img src="/assets/sona-ui/flame.svg" alt="" width="24" height="24"></span>
      <div class="s-search topsearch" id="searchBox">
        <svg class="s-i" aria-hidden="true"><use href="/assets/sona-ui/icons.svg#search"/></svg>
        <input class="s-input" id="search" type="search" role="combobox" aria-expanded="false" placeholder="Search tools" autocomplete="off" aria-label="Search tools (Ctrl+K)" aria-autocomplete="list" aria-controls="searchList">
        <kbd class="kbd" aria-hidden="true">Ctrl K</kbd>
        <div class="s-menu searchlist" id="searchList" role="listbox" aria-label="Matching tools" hidden></div>
      </div>
      <button class="engines" id="engines" title="Engines: click for details" aria-label="Engines: click for details"></button>
      <button class="s-iconbtn phone-only" id="themeBtn" data-scheme-cycle aria-label="Theme"><svg class="s-i" aria-hidden="true"><use href="/assets/sona-ui/icons.svg#auto"/></svg></button>
      <button class="s-iconbtn phone-only" id="lockBtnPhone" aria-label="Lock Forge" title="Lock Forge"><svg class="s-i" aria-hidden="true"><use href="/assets/sona-ui/icons.svg#lock"/></svg></button>
    </header>
    <nav class="toolbar" id="toolbar" aria-label="Actions"><!-- rendered per-tab by renderToolbar() --></nav>
    <section id="view" class="view" tabindex="-1" aria-live="polite">
      <div class="s-skel s-skel--title"></div>
      <div class="s-skel s-skel--text" style="width:60%;margin-top:14px"></div>
      <div class="s-skel dz-skel"></div>
    </section>
    <footer class="statusbar-g" id="statusG"><span id="stMsg" role="status">Loading</span><span id="stRight"><b>Sona</b> · files never leave the box</span></footer>
  </main>

  <!-- phone + tablet tab bar -->
  <nav class="s-tabbar s-tabbar--mobile tabbar" aria-label="Sections">
    <button class="s-tabbar__item nav" data-view="home"><svg class="s-i" aria-hidden="true"><use href="/assets/sona-ui/icons.svg#home"/></svg>Home</button>
    <button class="s-tabbar__item nav" data-view="media"><svg class="s-i" aria-hidden="true"><use href="/assets/sona-ui/icons.svg#film"/></svg>Media</button>
    <button class="s-tabbar__item nav" data-view="edit"><svg class="s-i" aria-hidden="true"><use href="/assets/sona-ui/icons.svg#scissors"/></svg>Editor</button>
    <button class="s-tabbar__item nav" data-view="archives"><svg class="s-i" aria-hidden="true"><use href="/assets/sona-ui/icons.svg#archive"/></svg>Archives</button>
    <button class="s-tabbar__item nav" data-view="jobs" aria-controls="jobsTray"><svg class="s-i" aria-hidden="true"><use href="/assets/sona-ui/icons.svg#layers"/></svg>Jobs<b class="jobbadge" aria-hidden="true"></b></button>
  </nav>

  <div id="drophint" class="drophint" aria-hidden="true"><div><svg class="s-i" aria-hidden="true"><use href="/assets/sona-ui/icons.svg#upload"/></svg><span>Drop a file. Forge reads it and shows what it can do.</span></div></div>
  <aside id="jobsTray" class="jobsTray" aria-label="Jobs" aria-hidden="true">
    <header class="jobsTray__head"><h2 class="s-sheet__title">Jobs</h2><button class="s-iconbtn" id="jobsClose" data-act="closeJobs" aria-label="Close jobs"><svg class="s-i" aria-hidden="true"><use href="/assets/sona-ui/icons.svg#close"/></svg></button></header>
    <div id="jobsList"></div>
  </aside>
  <div id="modal" class="s-scrim modal" hidden><section class="s-sheet modalBox" id="modalBox" role="dialog" aria-modal="true" aria-label="Dialog"></section></div>
</div>
<script src="/assets/sona-ui/ui.js"></script>
<script src="/public/ctxmenu.js"></script>
<script src="/public/app.js"></script>
<script src="/public/editor.js"></script>
</body>
</html>
