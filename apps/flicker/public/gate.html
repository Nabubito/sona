<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#161311">
<title>Flicker · Sona</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/sona.css">
<link rel="stylesheet" href="/assets/gate.css">
</head>
<body class="sona-gate">
<div class="vignette"></div><div class="grain"></div>
<main class="gate-panel">
  <div class="ember-mark">
    <svg viewBox="0 0 48 48" aria-hidden="true"><defs>
      <linearGradient id="au" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#F3CE86"/><stop offset=".5" stop-color="#E7A94C"/><stop offset="1" stop-color="#E1712B"/>
      </linearGradient></defs>
      <path fill="url(#au)" d="M24 3c1 7-3 11-7 15-2 2-4 5-4 9a11 11 0 0 0 22 0c0-5-3-8-6-12-1 3-3 4-5 5 2-6-1-12 0-17Z"/>
      <path fill="#161311" opacity=".22" d="M24 20c1 3-1 6-3 8-1 1-2 3-2 5a5 5 0 0 0 10 0c0-3-2-5-4-7 0 2-1 3-2 4 1-3 0-7 1-10Z"/>
    </svg>
  </div>
  <h1 class="app-name">Flicker</h1>
  <p class="app-tag">Your video studio</p>
  <form class="pass-form" id="form" autocomplete="off">
    <label class="pass-label" for="pass">Passcode</label>
    <div class="pass-wrap">
      <input id="pass" name="passcode" type="password" inputmode="text" autocomplete="current-password"
             autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="64" required>
      <button type="button" class="pass-eye" id="eye" aria-label="Show passcode" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <button type="submit" class="pass-go" id="go">Open</button>
  </form>
  <p class="gate-err" id="e" role="alert"></p>
</main>
<div class="gate-foot"><b>Sona</b> · under your roof</div>
<script src="/gate.js"></script>
</body>
</html>
